[General]
# Password mask character
passwordCharacter=*
passwordMask=true
# value "1" is all display width, "0.5" is a half of display width etc.
passwordInputWidth=0.25
# Frosted mint glass — matches hyprlock input-field
passwordInputBackground=#8CF2F7F4
passwordInputRadius=12
passwordInputCursorVisible=false
passwordFontSize=28
passwordCursorColor=#549D6C
passwordTextColor=#2A3F36

showSessionsByDefault=false
sessionsFontSize=24

showUsersByDefault=false
usersFontSize=32

# Same wallpaper as hyprpaper / hyprlock — file lives in theme dir so sddm can read it
# (~/Downloads is 700; greeter runs as user sddm and cannot load paths there)
background=background.jpg
backgroundFill=#121411
backgroundMode=aspect

basicTextColor=#E6F0EA

# Keep wallpaper sharp — no full-screen blur overlay
blurRadius=0
