<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Desktop UI: Inter first, then system fallbacks -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Jost</family>
      <family>Cantarell</family>
    </prefer>
  </alias>

  <!-- Monospace: clean JetBrains Mono in apps; Nerd Font still available by name -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>JetBrainsMonoNL Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Display / headings -->
  <alias>
    <family>display</family>
    <prefer>
      <family>Jost</family>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
