font_family JetBrainsMonoNL Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Solid enough to read; Hyprland window opacity still adds light frost
background_opacity 0.96
dynamic_background_opacity no
foreground #E8E6E0
background #121411
selection_foreground #121411
selection_background #6BBF88
cursor #7AD49A
cursor_text_color #121411
window_padding_width 8
enable_image_protocol yes

# black
color0  #121411
color8  #3A3C38

# red
color1  #E07070
color9  #F09090

# green
color2  #6BBF88
color10 #8FD4A8

# yellow / vine
color3  #C4A882
color11 #DCC4A0

# blue / sage
color4  #6A9E8A
color12 #8BB8A4

# magenta
color5  #8AAD9A
color13 #A8C8B6

# cyan
color6  #5AAD96
color14 #7EC8B4

# white (soft mint-gray, not pure white)
color7  #EEF6F1
color15 #F6FBF8
