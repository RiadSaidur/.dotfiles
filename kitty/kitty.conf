font_family Adwaita Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
adjust_line_height 108%

# Frosted glass — Hyprland blur + borders handle focus chrome (see hypr/rules.lua)
background_opacity 0.75
dim_opacity 0.50
dynamic_background_opacity yes
foreground #F0F6F2
background #060e0a
selection_foreground #0a1612
selection_background #6BBF88
cursor #8AE8B0
cursor_text_color #0a1612
window_padding_width 8
window_margin_width 0
hide_window_decorations yes
window_border_width 0
wayland_enable_ime no
enable_image_protocol yes

# High-contrast palette — hues spread apart so text stays clear on mint glass
# black
color0  #060e0a
color8  #7A9A8A

# red
color1  #FF7B7B
color9  #FFA8A8

# green
color2  #7AD49A
color10 #A8F0C0

# gold (not green-on-green)
color3  #F0C878
color11 #FFE0A0

# sky blue
color4  #7AB8FF
color12 #A8D4FF

# lavender
color5  #D4A8FF
color13 #E8C8FF

# aqua
color6  #6EE8D8
color14 #A0FFF0

# white
color7  #E8F4EE
color15 #FFFFFF
