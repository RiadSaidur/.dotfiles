conky.config = {
--==============================================================================
--  ATRIA  — compact cascade, vine palette
--  Display: Jost  ·  Meta: JetBrains Mono
--==============================================================================

  alignment = 'top_right',
  gap_x = 32,
  gap_y = 28,
  maximum_width = 320,
  minimum_width = 280,

  out_to_x = false,
  out_to_wayland = true,

  use_xft = true,
  override_utf8_locale = true,
  font = 'JetBrainsMonoNL Nerd Font:size=11',

  default_color = '#14241C',
  default_outline_color = '#A0E7CD',
  default_shade_color = '#E8F0EA',
  color1 = '#3D7A52',
  color2 = '#C4A882',
  color3 = '#2A4A3A',
  color4 = '#A0E7CD',

  background = false,
  border_width = 0,
  draw_borders = false,
  draw_blended = true,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '000000',
  own_window_class = 'Conky',
  own_window_argb_visual = true,
  own_window_type = 'desktop',
  own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  stippled_borders = 0,

  cpu_avg_samples = 2,
  net_avg_samples = 2,
  double_buffer = true,
  out_to_console = false,
  out_to_stderr = false,
  extra_newline = false,
  update_interval = 1,
  uppercase = false,
  use_spacer = 'none',
  show_graph_scale = false,
  show_graph_range = false,
}

conky.text = [[
${alignc 0}${voffset 12}${font JetBrainsMonoNL Nerd Font:medium:size=18}${color1}${execpi 10 ~/.config/conky/Atria/scripts/time.sh}${font} ${font JetBrainsMonoNL Nerd Font:size=9}${color3}${execi 60 date +"%Y"}${font}
${alignc 52}${voffset 14}${font Jost:bold:size=30}${color3}${execi 60 date +"%^A" | cut -b 1}${font}
${alignc 0}${voffset -36}${font Jost:bold:size=30}${color3}${execi 60 date +"%^A" | cut -b 2}${font}
${alignc -52}${voffset -34}${font Jost:bold:size=30}${color3}${execi 60 date +"%^A" | cut -b 3}${font}
${alignc 32}${voffset -24}${font JetBrainsMonoNL Nerd Font:size=96}${color1}${execpi 600 ~/.config/conky/Atria/scripts/weather-icon.sh}${font}${voffset -72}
${alignc 0}${voffset -4}${font Jost:bold:size=36}${color4}${execi 60 date +"%02d"}${font}
${alignc 52}${voffset 22}${font Jost:bold:size=30}${color3}${execi 60 date +"%^B" | cut -b 1}${font}
${alignc 0}${voffset -36}${font Jost:bold:size=30}${color3}${execi 60 date +"%^B" | cut -b 2}${font}
${alignc -52}${voffset -34}${font Jost:bold:size=30}${color3}${execi 60 date +"%^B" | cut -b 3}${font}
${alignc 0}${voffset 18}${font JetBrainsMonoNL Nerd Font:size=11}${color3}${execpi 360 ~/.config/conky/Atria/scripts/weather.sh}${font}
${alignc 0}${voffset 6}${font JetBrainsMonoNL Nerd Font:italic:size=10}${color2}${exec ~/.config/conky/Atria/scripts/playerctl.sh}${font}
${alignc 0}${font JetBrainsMonoNL Nerd Font:size=10}${color}${exec playerctl metadata xesam:title 2>/dev/null}${font}
]]
